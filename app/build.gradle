plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.vesta.hudbridge'
    compileSdk 34

    defaultConfig {
        applicationId "ru.vesta.hudbridge"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "3.0"
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'
}